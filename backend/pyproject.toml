[project]
name="vogel-gestion-servicios-backend"
version="0.1.0"
requires-python=">=3.12"
dependencies=["fastapi>=0.116,<1","uvicorn[standard]>=0.35,<1","sqlalchemy>=2.0,<3","pymysql>=1.1,<2","alembic>=1.16,<2","pydantic-settings>=2.10,<3","python-jose[cryptography]>=3.5,<4","passlib[bcrypt]>=1.7,<2","bcrypt>=4.0,<4.1","python-multipart>=0.0.20,<1","email-validator>=2.2,<3"]
[project.optional-dependencies]
dev=["pytest>=8.4,<9","httpx>=0.28,<1"]
[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[tool.setuptools.packages.find]
where=["."]
include=["app*"]
exclude=["tests*","alembic*"]
[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]
