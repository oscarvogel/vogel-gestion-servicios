# Config del contenedor frontend: nginx sirve el SPA y proxea /api/ al backend.
#
# Objetivo: el browser llama SIEMPRE al mismo origen (/api/v1), asi que el navegador
# nunca hace una peticion cross-origin y no hay CORS que resolver. El backend igual
# mantiene CORS_ORIGINS porque el dev sin Docker sigue hablando 5173 -> 8000.
#
# NO usar placeholders de variable de entorno en este archivo: el entrypoint de
# nginx:alpine corre envsubst sobre /etc/nginx/templates/ y deja esos placeholders
# literales, rompiendo el arranque con "closing bracket missing". El destino del
# backend se inyecta en build (ver Dockerfile), no en runtime.
#
# BACKEND_INTERNAL_URL: base del backend SIN trailing slash.
#   - docker-compose: http://backend:8000
#   - Coolify:         http://<alias-de-red>:8000
#
# En Coolify NO usar la URL publica del backend: no resuelve desde dentro del
# contenedor. Usar el alias de red del backend (custom_network_aliases), que es estable;
# el nombre del contenedor lleva timestamp y cambia en cada deploy.
# Ver docs/deploy-coolify.md.
#
# Se usa variable ($backend) + resolver a proposito: con un destino estatico nginx
# resuelve el hostname AL ARRANCAR y si el DNS falla el contenedor no levanta.
# Con variable la resolucion es LAZY, asi que nginx siempre arranca.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS embebido de Docker. 127.0.0.11 responde con la config del host, asi que
    # este valor sirve para cualquier red de compose sin tocarlo.
    resolver 127.0.0.11 valid=30s;

    # API en el mismo origen del browser: cero CORS.
    location /api/ {
        set $backend __BACKEND_INTERNAL_URL__;
        proxy_pass $backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Estado del backend a traves del mismo origen, util para debug.
    location = /health {
        set $backend __BACKEND_INTERNAL_URL__;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA con history routing: cualquier ruta desconocida devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
