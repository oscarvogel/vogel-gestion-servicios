services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: vogel_gestion_servicios
      MYSQL_USER: vogel
      MYSQL_PASSWORD: change_me
      MYSQL_ROOT_PASSWORD: change_root
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
  frontend:
    build:
      context: ./frontend
      args:
        # Mismo origen: el front llama a /api/v1 y nginx lo proxea al backend.
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        # Base del backend sin trailing slash, horneada en nginx.conf en build.
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
    depends_on: [backend]
    ports: ["5173:80"]
volumes:
  mysql_data:
